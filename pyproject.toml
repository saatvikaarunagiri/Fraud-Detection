[project]
name = "fraud-detection"
version = "0.1.0"
description = "Real-time fraud detection + personalization — runnable on an M-series Mac."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["p2_fraud/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
